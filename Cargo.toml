[package]
name = "sluuz"
version = "0.6.5"
edition = "2024"
rust-version = "1.88"
description = "git, but it sleuths - a git superset with cross-repo search, secret scanning, and multi-repo management"
authors = ["Pablo Antonio Hernández Hernández (safteinzz)"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://gitlab.com/safteinzz/sluuz"
keywords = ["git", "vcs", "tui", "cli", "secrets"]
categories = ["command-line-utilities", "development-tools"]
# README screenshots are fetched over the network by crates.io via absolute raw
# URLs, never read out of the package, so shipping them would only bloat every
# download. `demo/` is the rig that renders them - source for the pictures, and
# never needed to build or run the crate.
exclude = ["readme-assets/", "legacy/", "demo/"]

# The crate is `sluuz`, but the command you type is the shorter `slu`.
[[bin]]
name = "slu"
path = "src/main.rs"

[dependencies]
clap          = { version = "4", features = ["derive"] } # CLI argument parsing
colored       = "2"                                       # terminal colors
rayon         = "1"                                       # parallel iterators
walkdir       = "2"                                       # recursive directory walking
terminal_size = "0.4"                                     # detect terminal width for truncation
ratatui       = "0.29"                                    # TUI for `slu ilog` / `ibranch`
# syntect with the pure-Rust fancy-regex backend (no C/oniguruma) so it builds
# clean on Windows; used to syntax-highlight diffs in the TUI.
syntect       = { version = "5", default-features = false, features = ["default-fancy"] }
